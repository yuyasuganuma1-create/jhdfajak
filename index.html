<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>現場撮影用Webアプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    
    .app-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    /* 左側：カメラ表示エリア */
    .camera-panel {
      flex: 1;
      position: relative;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #capturedCanvas {
      display: none;
    }

    /* 撮影前のリアルタイム表示（左下） */
    .live-overlay {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background-color: rgba(0, 0, 0, 0.75);
      border-left: 6px solid #ffd700;
      padding: 12px 18px;
      border-radius: 6px;
      pointer-events: none;
      max-width: 80%;
      z-index: 10;
    }

    .live-title { color: #ffd700; font-weight: bold; line-height: 1.2; }
    .live-tags { color: #ffffff; font-weight: bold; margin-top: 6px; line-height: 1.3; }
    .live-date { color: #dddddd; font-size: 0.85em; margin-top: 4px; }

    /* 右側：スリムな操作パネル */
    .control-panel {
      width: 330px;
      background-color: #1a1a1a;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      border-left: 2px solid #333333;
      padding-bottom: 120px; /* 下部100px浮かせのボタン領域分の余白 */
      position: relative;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #ffd700;
      border-bottom: 2px solid #ffd700;
      padding-bottom: 2px;
      margin-bottom: 6px;
    }

    .input-box {
      width: 100%;
      padding: 8px 10px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      border: 2px solid #555555;
      background-color: #2b2b2b;
      color: #ffffff;
    }

    .add-tag-box {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .add-tag-box select {
      padding: 6px;
      background-color: #2b2b2b;
      color: #ffffff;
      border: 2px solid #555555;
      border-radius: 6px;
      font-weight: bold;
    }

    .add-tag-box input {
      flex: 1;
      padding: 6px 8px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: 2px solid #555555;
      background-color: #2b2b2b;
      color: #ffffff;
    }

    .btn-add {
      padding: 6px 12px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 属性タグボタングループ（削除ボタン付き） */
    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-wrapper {
      display: inline-flex;
      align-items: center;
      background-color: #333333;
      border: 2px solid #555555;
      border-radius: 6px;
      overflow: hidden;
    }

    .tag-wrapper.active {
      background-color: #0056b3;
      border-color: #ffd700;
    }

    .tag-btn-text {
      padding: 8px 10px;
      font-size: 1.05rem;
      font-weight: bold;
      color: #ffffff;
      background: none;
      border: none;
      cursor: pointer;
    }

    .tag-del-btn {
      padding: 8px 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #ff6b6b;
      background: rgba(0, 0, 0, 0.2);
      border: none;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
    }

    .tag-del-btn:hover {
      background-color: #dc2626;
      color: #ffffff;
    }

    .slider-group {
      background-color: #262626;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #444444;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .slider-input {
      width: 100%;
      height: 24px;
      cursor: pointer;
    }

    /* 撮影ボタン群（最下部から100px上に配置） */
    .action-group {
      position: absolute;
      bottom: 100px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 20;
    }

    .btn-main {
      flex: 1;
      padding: 14px 10px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .btn-shutter { background-color: #e63946; color: #ffffff; }
    .btn-save { background-color: #2a9d8f; color: #ffffff; }
    .btn-reset { background-color: #6c757d; color: #ffffff; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 左側：カメラ表示エリア -->
    <div class="camera-panel">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="capturedCanvas"></canvas>

      <!-- 撮影前のリアルタイム表示 -->
      <div id="liveOverlay" class="live-overlay">
        <div id="liveTitle" class="live-title">第1工区 擁壁点検</div>
        <div id="liveTags" class="live-tags">主桁 / ひびわれ</div>
        <div id="liveDate" class="live-date">---</div>
      </div>
    </div>

    <!-- 右側：スリムな操作パネル -->
    <div class="control-panel">
      <!-- 現場タイトル入力 -->
      <div>
        <div class="section-title">現場タイトル</div>
        <input type="text" id="siteTitle" class="input-box" value="第1工区 擁壁点検" placeholder="タイトルを入力" oninput="updatePreview()">
      </div>

      <!-- 部位カテゴリ（複数選択対応・削除ボタン付き） -->
      <div>
        <div class="section-title">■ 部位カテゴリ</div>
        <div id="buisContainer" class="tag-group"></div>
      </div>

      <!-- 状態カテゴリ（複数選択対応・削除ボタン付き） -->
      <div>
        <div class="section-title">■ 状態カテゴリ</div>
        <div id="jotaisContainer" class="tag-group"></div>
      </div>

      <!-- カスタムタグ追加フォーム -->
      <div>
        <div class="section-title">＋ 属性タグを追加</div>
        <div class="add-tag-box">
          <select id="targetCategory">
            <option value="部位">部位</option>
            <option value="状態">状態</option>
          </select>
          <input type="text" id="newTagName" placeholder="例: 新規タグ">
          <button class="btn-add" onclick="addNewTag()">追加</button>
        </div>
      </div>

      <!-- 文字サイズ調整スライダー -->
      <div class="slider-group">
        <div class="slider-header">
          <span>合成文字サイズ</span>
          <span id="fontSizeVal">48px</span>
        </div>
        <input type="range" id="fontSizeSlider" class="slider-input" min="20" max="150" value="48" oninput="updateFontSize(this.value)">
      </div>

      <!-- 撮影アクションボタン（最下部から100px上に配置） -->
      <div class="action-group">
        <button id="shutterBtn" class="btn-main btn-shutter" onclick="takePhoto()">📷 撮影する</button>
        <button id="saveBtn" class="btn-main btn-save" onclick="saveAsJpeg()" style="display:none;">💾 JPEG保存</button>
        <button id="resetBtn" class="btn-main btn-reset" onclick="resetCamera()" style="display:none;">🔄 再撮影</button>
      </div>
    </div>
  </div>

  <script>
    // --- オフライン自動キャッシュ登録処理 (Service Worker インライン生成) ---
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'site-camera-v4';
        self.addEventListener('install', (e) => {
          e.waitUntil(
            caches.open(CACHE_NAME).then((cache) => cache.addAll(['./', './index.html']))
          );
          self.skipWaiting();
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(self.clients.claim());
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            caches.match(e.request).then((res) => res || fetch(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW register failed:', err));
    }

    // --- アプリのメイン機能 ---
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('capturedCanvas');
    const ctx = canvas.getContext('2d');
    const shutterBtn = document.getElementById('shutterBtn');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const liveOverlay = document.getElementById('liveOverlay');

    let overlayFontSize = 48;

    // ご指定いただいたすべての属性一覧（部位と状態）を完全に網羅
    let tagData = {
      "部位": [
        "排水ます", "伸縮装置", "上流側", "終点側", "起点側", "添架物", 
        "舗装", "主桁", "排水管", "地覆", "A1橋台", "A2橋台", 
        "高欄", "床版", "横桁", "支承", "下流側"
      ],
      "状態": [
        "変形", "腐食", "ひびわれ", "滞水", "破断", "抜け落ち", 
        "土砂詰まり", "路面の凹凸", "舗装の異常", "防食機能の劣化", 
        "鉄筋露出", "漏水", "洗堀", "剥離", "うき", "欠損", 
        "遊離石灰", "遊間の異常", "補修済み"
      ]
    };

    // 複数選択に対応（初期選択として最初のタグなどを指定）
    let selectedTags = {
      "部位": ["主桁"],
      "状態": ["ひびわれ"]
    };

    function renderTags() {
      // 部位のレンダリング
      const buisContainer = document.getElementById('buisContainer');
      buisContainer.innerHTML = '';
      tagData["部位"].forEach(name => {
        const isSelected = selectedTags["部位"].includes(name);
        const wrapper = document.createElement('div');
        wrapper.className = 'tag-wrapper' + (isSelected ? ' active' : '');

        const btnText = document.createElement('button');
        btnText.className = 'tag-btn-text';
        btnText.innerText = name;
        btnText.onclick = () => toggleTag('部位', name);

        const btnDel = document.createElement('button');
        btnDel.className = 'tag-del-btn';
        btnDel.innerText = '✕';
        btnDel.title = '削除';
        btnDel.onclick = (e) => { e.stopPropagation(); deleteTag('部位', name); };

        wrapper.appendChild(btnText);
        wrapper.appendChild(btnDel);
        buisContainer.appendChild(wrapper);
      });

      // 状態のレンダリング
      const jotaisContainer = document.getElementById('jotaisContainer');
      jotaisContainer.innerHTML = '';
      tagData["状態"].forEach(name => {
        const isSelected = selectedTags["状態"].includes(name);
        const wrapper = document.createElement('div');
        wrapper.className = 'tag-wrapper' + (isSelected ? ' active' : '');

        const btnText = document.createElement('button');
        btnText.className = 'tag-btn-text';
        btnText.innerText = name;
        btnText.onclick = () => toggleTag('状態', name);

        const btnDel = document.createElement('button');
        btnDel.className = 'tag-del-btn';
        btnDel.innerText = '✕';
        btnDel.title = '削除';
        btnDel.onclick = (e) => { e.stopPropagation(); deleteTag('状態', name); };

        wrapper.appendChild(btnText);
        wrapper.appendChild(btnDel);
        jotaisContainer.appendChild(wrapper);
      });
    }

    // タグのON/OFF（複数選択）切り替え
    function toggleTag(category, name) {
      if (selectedTags[category].includes(name)) {
        selectedTags[category] = selectedTags[category].filter(item => item !== name);
      } else {
        selectedTags[category].push(name);
      }
      renderTags();
      updatePreview();
    }

    function deleteTag(category, name) {
      tagData[category] = tagData[category].filter(item => item !== name);
      selectedTags[category] = selectedTags[category].filter(item => item !== name);
      renderTags();
      updatePreview();
    }

    function addNewTag() {
      const category = document.getElementById('targetCategory').value;
      const input = document.getElementById('newTagName');
      const val = input.value.trim();

      if (!val) {
        alert("追加する属性名を入力してください。");
        return;
      }

      if (!tagData[category].includes(val)) {
        tagData[category].push(val);
        selectedTags[category].push(val); // 追加したタグを自動選択
        input.value = '';
        renderTags();
        updatePreview();
      } else {
        alert("すでに存在するタグ名です。");
      }
    }

    function getNowString() {
      const now = new Date();
      return now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate() + ' ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    function updatePreview() {
      const title = document.getElementById('siteTitle').value || '';
      document.getElementById('liveTitle').innerText = title;
      document.getElementById('liveTitle').style.fontSize = overlayFontSize + 'px';

      const allSelected = [...selectedTags["部位"], ...selectedTags["状態"]];
      const tagText = allSelected.join(' / ');

      document.getElementById('liveTags').innerText = tagText;
      document.getElementById('liveTags').style.fontSize = Math.round(overlayFontSize * 0.85) + 'px';
      document.getElementById('liveDate').innerText = getNowString();
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" },
        audio: false
      }).then(stream => {
        video.srcObject = stream;
      }).catch(err => {
        alert("カメラの許可が必要です。ブラウザの設定でカメラアクセスを許可してください。");
      });
    }

    function updateFontSize(val) {
      overlayFontSize = parseInt(val, 10);
      document.getElementById('fontSizeVal').innerText = val + 'px';
      updatePreview();
    }

    // 撮影処理（4:3自動トリミング ＋ 複数選択タグ合成）
    function takePhoto() {
      const vWidth = video.videoWidth || 1280;
      const vHeight = video.videoHeight || 720;

      let cropWidth, cropHeight, cropX, cropY;
      const targetRatio = 4 / 3;
      const currentRatio = vWidth / vHeight;

      if (currentRatio > targetRatio) {
        cropHeight = vHeight;
        cropWidth = vHeight * targetRatio;
        cropX = (vWidth - cropWidth) / 2;
        cropY = 0;
      } else {
        cropWidth = vWidth;
        cropHeight = vWidth / targetRatio;
        cropX = 0;
        cropY = (vHeight - cropHeight) / 2;
      }

      canvas.width = cropWidth;
      canvas.height = cropHeight;

      const baseWidth = 1280;
      const scale = Math.max(canvas.width / baseWidth, 1.0); 
      const drawFontSize = overlayFontSize * scale;

      ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);

      const siteTitle = document.getElementById('siteTitle').value;
      const allSelected = [...selectedTags["部位"], ...selectedTags["状態"]];
      const tagText = allSelected.join(' / ');
      const dateStr = getNowString();

      const padding = 20 * scale;
      const x = padding;
      let y = canvas.height - padding - (drawFontSize * 2.5);

      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(x - (10 * scale), y - drawFontSize, canvas.width * 0.7, drawFontSize * 3.5);

      ctx.fillStyle = "#FFD700";
      ctx.font = `bold ${drawFontSize}px sans-serif`;
      ctx.fillText(siteTitle, x, y);

      ctx.fillStyle = "#FFFFFF";
      ctx.font = `bold ${Math.round(drawFontSize * 0.85)}px sans-serif`;
      ctx.fillText(tagText, x, y + drawFontSize * 1.1);

      ctx.fillStyle = "#DDDDDD";
      ctx.font = `${Math.round(drawFontSize * 0.7)}px sans-serif`;
      ctx.fillText(dateStr, x, y + drawFontSize * 2.1);

      video.style.display = 'none';
      liveOverlay.style.display = 'none';
      canvas.style.display = 'block';

      shutterBtn.style.display = 'none';
      saveBtn.style.display = 'block';
      resetBtn.style.display = 'block';
    }

    function resetCamera() {
      canvas.style.display = 'none';
      video.style.display = 'block';
      liveOverlay.style.display = 'block';

      shutterBtn.style.display = 'block';
      saveBtn.style.display = 'none';
      resetBtn.style.display = 'none';
    }

    function saveAsJpeg() {
      const link = document.createElement('a');
      const timeStamp = new Date().toISOString().replace(/[-:T.]/g, "").slice(0, 14);
      link.download = `photo_${timeStamp}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.92);
      link.click();
    }

    window.onload = () => {
      renderTags();
      startCamera();
      updatePreview();
      setInterval(() => { document.getElementById('liveDate').innerText = getNowString(); }, 10000);
    };
  </script>
</body>
</html>
