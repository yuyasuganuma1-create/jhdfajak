<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>現場撮影用Webアプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    
    .app-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    /* 左側：カメラ表示エリア */
    .camera-panel {
      flex: 1;
      position: relative;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 10px;
    }

    .camera-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #111111;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    video, #capturedCanvas, #simCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000000;
    }

    #capturedCanvas {
      display: none;
    }

    /* 撮影前のリアルタイム表示 */
    .live-overlay {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background-color: rgba(0, 0, 0, 0.78);
      border-left: 5px solid #ffd700;
      padding: 10px 14px;
      border-radius: 4px;
      pointer-events: none;
      max-width: calc(100% - 48px);
      z-index: 10;
      word-break: break-all;
    }

    .live-title { 
      color: #ffd700; 
      font-weight: bold; 
      line-height: 1.25; 
      margin-bottom: 4px;
    }
    .live-tags { 
      color: #ffffff; 
      font-weight: bold; 
      line-height: 1.3; 
    }

    /* 右側：操作パネル */
    .control-panel {
      width: 320px;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      height: 100vh;
      border-left: 2px solid #333333;
      z-index: 20;
    }

    .control-scroll-area {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #ffd700;
      border-bottom: 2px solid #ffd700;
      padding-bottom: 2px;
      margin-bottom: 6px;
    }

    .input-box {
      width: 100%;
      padding: 6px 8px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      border: 2px solid #555555;
      background-color: #2b2b2b;
      color: #ffffff;
    }

    .add-tag-box {
      display: flex;
      gap: 4px;
    }

    .add-tag-box select {
      padding: 4px;
      background-color: #2b2b2b;
      color: #ffffff;
      border: 2px solid #555555;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .add-tag-box input {
      flex: 1;
      padding: 4px 6px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 2px solid #555555;
      background-color: #2b2b2b;
      color: #ffffff;
      min-width: 0;
    }

    .btn-add {
      padding: 4px 10px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-wrapper {
      display: inline-flex;
      align-items: center;
      background-color: #333333;
      border: 2px solid #555555;
      border-radius: 6px;
      overflow: hidden;
    }

    .tag-wrapper.active {
      background-color: #0056b3;
      border-color: #ffd700;
    }

    .tag-btn-text {
      padding: 5px 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #ffffff;
      background: none;
      border: none;
      cursor: pointer;
    }

    .tag-del-btn {
      padding: 5px 6px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #ff6b6b;
      background: rgba(0, 0, 0, 0.2);
      border: none;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
    }

    .slider-group {
      background-color: #262626;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #444444;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .slider-input {
      width: 100%;
      cursor: pointer;
    }

    .action-group {
      padding: 10px;
      background-color: #1a1a1a;
      border-top: 2px solid #333333;
      display: flex;
      gap: 8px;
    }

    .btn-main {
      flex: 1;
      padding: 12px 8px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-shutter { background-color: #e63946; color: #ffffff; }
    .btn-save { background-color: #2a9d8f; color: #ffffff; }
    .btn-reset { background-color: #6c757d; color: #ffffff; }

    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
      }
      .camera-panel {
        flex: none;
        height: 52vh;
        width: 100vw;
        padding: 4px;
      }
      .control-panel {
        flex: 1;
        width: 100vw;
        height: 48vh;
        border-left: none;
        border-top: 2px solid #333333;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="camera-panel">
      <div id="cameraWrapper" class="camera-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="simCanvas" style="display:none;"></canvas>
        <canvas id="capturedCanvas"></canvas>

        <div id="liveOverlay" class="live-overlay">
          <div id="liveTitle" class="live-title">第1工区 擁壁点検</div>
          <div id="liveTags" class="live-tags">主桁 / ひびわれ</div>
        </div>
      </div>
    </div>

    <div class="control-panel">
      <div class="control-scroll-area">
        <div>
          <div class="section-title">現場タイトル</div>
          <input type="text" id="siteTitle" class="input-box" value="第1工区 擁壁点検" placeholder="タイトルを入力" oninput="updatePreview()">
        </div>

        <div>
          <div class="section-title">■ 部位カテゴリ</div>
          <div id="buisContainer" class="tag-group"></div>
        </div>

        <div>
          <div class="section-title">■ 状態カテゴリ</div>
          <div id="jotaisContainer" class="tag-group"></div>
        </div>

        <div>
          <div class="section-title">＋ 属性タグを追加</div>
          <div class="add-tag-box">
            <select id="targetCategory">
              <option value="部位">部位</option>
              <option value="状態">状態</option>
            </select>
            <input type="text" id="newTagName" placeholder="新規タグ名">
            <button class="btn-add" onclick="addNewTag()">追加</button>
          </div>
        </div>

        <div class="slider-group">
          <div class="slider-header">
            <span>合成文字サイズ</span>
            <span id="fontSizeVal">24px</span>
          </div>
          <input type="range" id="fontSizeSlider" class="slider-input" min="14" max="44" value="24" oninput="updateFontSize(this.value)">
        </div>
      </div>

      <div class="action-group">
        <button id="shutterBtn" class="btn-main btn-shutter" onclick="takePhoto()">📷
