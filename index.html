<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>現場撮影用Webアプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    
    .app-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    /* 左側：カメラ表示エリア */
    .camera-panel {
      flex: 1;
      position: relative;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 10px;
    }

    /* 4:3比率を完全に固定し、親領域に最大収まるように配置 */
    .camera-wrapper {
      position: relative;
      aspect-ratio: 4 / 3;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      background-color: #111111;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    /* videoとcanvasの描画ルールを完全一致させる */
    video, #capturedCanvas, #simCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #capturedCanvas {
      display: none;
    }

    /* 撮影前のリアルタイム表示 */
    .live-overlay {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background-color: rgba(0, 0, 0, 0.78);
      border-left: 5px solid #ffd700;
      padding: 10px 14px;
      border-radius: 4px;
      pointer-events: none;
      max-width: calc(100% - 32px);
      z-index: 10;
      word-break: break-all;
    }

    .live-title { 
      color: #ffd700; 
      font-weight: bold; 
      line-height: 1.25; 
      margin-bottom: 4px;
    }
    .live-tags { 
      color: #ffffff; 
      font-weight: bold; 
      line-height: 1.3; 
    }

    /* 右側：操作パネル */
    .control-panel {
      width: 320px;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      height: 100vh;
      border-left: 2px solid #333333;
    }

    .control-scroll-area {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #ffd700;
      border-bottom: 2px solid #ffd700;
      padding-bottom: 2px;
      margin-bottom: 6px;
    }

    .input-box {
      width: 100%;
      padding: 6px 8px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      border: 2px solid #555555;
      background-color: #2b2b2b;
      color: #ffffff;
    }

    .add-tag-box {
      display: flex;
      gap: 4px;
    }

    .add-tag-box select {
      padding: 4px;
      background-color: #2b2b2b;
