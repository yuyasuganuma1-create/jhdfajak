<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>現場撮影用Webアプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html, body {
      background-color: #000000;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }
    
    /* スマホを縦(Portrait)で持っているときは、画面全体を90度回転させて横画面レイアウトとして強制表示 */
    @media screen and (orientation: portrait) {
      body {
        width: 100vh;
        height: 100vw;
        transform: rotate(90deg);
        transform-origin: top left;
        position: absolute;
        top: 0;
        left: 100vw;
      }
    }
    /* スマホを横(Landscape)で持っているときはそのまま */
    @media screen and (orientation: landscape) {
      body {
        width: 100vw;
        height: 100vh;
        transform: none;
        position: static;
      }
    }

    /* 横持ち専用：左にカメラ、右に操作パネル */
    .app-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    /* 左側：カメラ表示エリア */
    .camera-panel {
      flex: 1;
      position: relative;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      height: 100%;
      padding: 4px;
    }

    /* 4:3固定フレーム */
    .preview-frame {
      position: relative;
      aspect-ratio: 4 / 3;
      max-width: 100%;
      max-height: 100%;
      background-color: #111111;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #capturedCanvas {
      display: none;
    }

    /* 撮影前のリアルタイム表示（4:3枠内の左下に配置） */
    .live-overlay {
      position: absolute;
      bottom: 3%;
      left: 3%;
      background-color: rgba(0, 0, 0, 0.75);
      border-left: 4px solid #ffd700;
      padding: 8px 12px;
      border-radius: 4px;
      pointer-events: none;
      max-width: 85%;
      z-index: 10;
    }

    .live-title { color: #ffd700; font-weight: bold; line-height: 1.25; white-space: nowrap; }
    .live-tags { color: #ffffff; font-weight: bold; line-height: 1.25; margin-top: 2px; white-space: nowrap; }
    .live-date { color: #dddddd; line-height: 1.25; margin-top: 2px; white-space: nowrap; }

    /* 右側：操作パネル */
    .control-panel {
      width: 290px;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      height: 100%;
      border-left: 2px solid #333333;
    }

    .control-scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: #ffd700;
      border-bottom: 1px solid #ffd700;
      padding-bottom: 1px;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-box {
      width: 100%;
      padding: 4px 6px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid #555555;
      background-color: #2b2b2b;
      color: #ffffff;
    }

    .add-tag-box {
      display: flex;
      gap: 3px;
      margin-top: 2px;
    }

    .add-tag-box select {
      padding: 3px;
      background-color: #2b2b2b;
      color: #ffffff;
      border: 1px solid #555555;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.75rem;
    }

    .add-tag-box input {
      flex: 1;
      padding: 3px 6px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: 1px solid #555555;
      background-color: #2b2b2b;
      color: #ffffff;
    }

    .btn-add {
      padding: 3px 8px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .save-status {
      font-size: 0.65rem;
      color: #4ade80;
      font-weight: normal;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .tag-wrapper {
      display: inline-flex;
      align-items: center;
      background-color: #333333;
      border: 1px solid #555555;
      border-radius: 4px;
      overflow: hidden;
    }

    .tag-wrapper.custom-tag {
      border-color: #3b82f6;
    }

    .tag-wrapper.active {
      background-color: #0056b3;
      border-color: #ffd700;
    }

    .tag-btn-text {
      padding: 3px 6px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #ffffff;
      background: none;
      border: none;
      cursor: pointer;
    }

    .tag-del-btn {
      padding: 3px 5px;
      font-size: 0.65rem;
      font-weight: bold;
      color: #ff6b6b;
      background: rgba(0, 0, 0, 0.25);
      border: none;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
    }

    .tag-del-btn:hover {
      background-color: #dc2626;
      color: #ffffff;
    }

    .slider-group {
      background-color: #262626;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #444444;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .slider-input {
      width: 100%;
      height: 14px;
      cursor: pointer;
    }

    .btn-clear-custom {
      background: #2b2b2b;
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      align-self: flex-end;
    }

    /* 撮影ボタン群（一番下に独立配置） */
    .action-group {
      flex-shrink: 0;
      padding: 6px;
      background-color: #1a1a1a;
      border-top: 2px solid #333333;
      display: flex;
      gap: 4px;
    }

    .btn-main {
      flex: 1;
      padding: 8px 2px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .btn-shutter { background-color: #e63946; color: #ffffff; }
    .btn-save { background-color: #2a9d8f; color: #ffffff; }
    .btn-reset { background-color: #6c757d; color: #ffffff; }
  </style>
</head>
<body>

  <div class="app-container" id="appContainer">
    <!-- 左側：カメラ表示エリア -->
    <div class="camera-panel" id="cameraPanel">
      <div class="preview-frame" id="previewFrame">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="capturedCanvas"></canvas>

        <!-- 撮影前のリアルタイム表示 -->
        <div id="liveOverlay" class="live-overlay">
          <div id="liveTitle" class="live-title">第1工区 擁壁点検</div>
          <div id="liveTags" class="live-tags">主桁 / ひびわれ</div>
          <div id="liveDate" class="live-date">---</div>
        </div>
      </div>
    </div>

    <!-- 右側：操作パネル -->
    <div class="control-panel">
      <div class="control-scroll-area">
        <div>
          <div class="section-title">
            <span>現場タイトル</span>
            <span id="saveMsg" class="save-status">✓ 保存済</span>
          </div>
          <input type="text" id="siteTitle" class="input-box" value="第1工区 擁壁点検" placeholder="タイトルを入力" oninput="onTitleInput()">
        </div>

        <div>
          <div class="section-title">■ 部位カテゴリ</div>
          <div id="buisContainer" class="tag-group"></div>
        </div>

        <div>
          <div class="section-title">■ 状態カテゴリ</div>
          <div id="jotaisContainer" class="tag-group"></div>
        </div>

        <div>
          <div class="section-title">＋ 属性タグを追加（追加分のみ削除可）</div>
          <div class="add-tag-box">
            <select id="targetCategory">
              <option value="部位">部位</option>
              <option value="状態">状態</option>
            </select>
            <input type="text" id="newTagName" placeholder="例: 新規タグ" onkeydown="if(event.key==='Enter'){event.preventDefault();addNewTag();}">
            <button class="btn-add" onclick="addNewTag()">追加</button>
          </div>
        </div>

        <div class="slider-group">
          <div class="slider-header">
            <span>文字サイズ調整</span>
            <span id="fontSizeVal">24px</span>
          </div>
          <input type="range" id="fontSizeSlider" class="slider-input" min="14" max="60" value="24" oninput="updateFontSize(this.value)">
        </div>

        <button class="btn-clear-custom" onclick="clearCustomTagsOnly()">🗑️ 追加した属性のみ一括削除</button>
      </div>

      <div class="action-group">
        <button id="shutterBtn" class="btn-main btn-shutter" onclick="takePhoto()">📷 撮影する</button>
        <button id="saveBtn" class="btn-main btn-save" onclick="saveAsJpeg()" style="display:none;">💾 JPEG保存</button>
        <button id="resetBtn" class="btn-main btn-reset" onclick="resetCamera()" style="display:none;">🔄 再撮影</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'site-camera-v26';
        self.addEventListener('install', (e) => {
          e.waitUntil(
            caches.open(CACHE_NAME).then((cache) => cache.addAll(['./', './index.html']))
          );
          self.skipWaiting();
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(
            caches.keys().then((keys) => Promise.all(
              keys.map((k) => { if (k !== CACHE_NAME) return caches.delete(k); })
            )).then(() => self.clients.claim())
          );
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            fetch(e.request).catch(() => caches.match(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW register failed:', err));
    }

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('capturedCanvas');
    const ctx = canvas.getContext('2d');
    const previewFrame = document.getElementById('previewFrame');
    const shutterBtn = document.getElementById('shutterBtn');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const liveOverlay = document.getElementById('liveOverlay');
    const siteTitleInput = document.getElementById('siteTitle');
    const saveMsg = document.getElementById('saveMsg');

    let currentStream = null;
    let isPhotoTaken = false;
    let saveMsgTimer = null;

    const STORAGE_KEY_CUSTOM_TAGS = 'site_camera_custom_tags_v1';
    const STORAGE_KEY_SELECTED = 'site_camera_selected_tags_v1';
    const STORAGE_KEY_TITLE = 'site_camera_site_title_v1';
    const STORAGE_KEY_FONTSIZE = 'site_camera_font_size_v1';

    const DEFAULT_TAGS = {
      "部位": [
        "排水ます", "伸縮装置", "上流側", "終点側", "起点側", "添架物", 
        "舗装", "主桁", "排水管", "地覆", "A1橋台", "A2橋台", 
        "高欄", "床版", "横桁", "支承", "下流側"
      ],
      "状態": [
        "変形", "腐食", "ひびわれ", "滞水", "破断", "抜け落ち", 
        "土砂詰まり", "路面の凹凸", "舗装の異常", "防食機能の劣化", 
        "鉄筋露出", "漏水", "洗堀", "剥離", "うき", "欠損", 
        "遊離石灰", "遊間の異常", "補修済み"
      ]
    };

    let savedFontSize = localStorage.getItem(STORAGE_KEY_FONTSIZE);
    let overlayFontSize = savedFontSize ? parseInt(savedFontSize, 10) : 24;

    let customTags = { "部位": [], "状態": [] };
    try {
      const rawCustom = localStorage.getItem(STORAGE_KEY_CUSTOM_TAGS);
      if (rawCustom) {
        const parsed = JSON.parse(rawCustom);
        if (parsed && Array.isArray(parsed["部位"]) && Array.isArray(parsed["状態"])) {
          customTags = parsed;
        }
      }
    } catch (e) {
      customTags = { "部位": [], "状態": [] };
    }

    let selectedTags;
    try {
      const rawSelected = localStorage.getItem(STORAGE_KEY_SELECTED);
      const parsedSel = rawSelected ? JSON.parse(rawSelected) : null;
      if (parsedSel && Array.isArray(parsedSel["部位"]) && Array.isArray(parsedSel["状態"])) {
        selectedTags = parsedSel;
      } else {
        selectedTags = { "部位": ["主桁"], "状態": ["ひびわれ"] };
      }
    } catch (e) {
      selectedTags = { "部位": ["主桁"], "状態": ["ひびわれ"] };
    }

    function showSaveIndicator() {
      saveMsg.style.opacity = '1';
      if (saveMsgTimer) clearTimeout(saveMsgTimer);
      saveMsgTimer = setTimeout(() => { saveMsg.style.opacity = '0'; }, 1500);
    }

    function saveTagsToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_CUSTOM_TAGS, JSON.stringify(customTags));
        localStorage.setItem(STORAGE_KEY_SELECTED, JSON.stringify(selectedTags));
        showSaveIndicator();
      } catch (e) {}
    }

    function onTitleInput() {
      try {
        localStorage.setItem(STORAGE_KEY_TITLE, siteTitleInput.value);
        showSaveIndicator();
      } catch (e) {}
      updatePreview();
    }

    function clearCustomTagsOnly() {
      const totalCustom = customTags["部位"].length + customTags["状態"].length;
      if (totalCustom === 0) {
        alert("現在、追加された属性タグはありません。");
        return;
      }
      if (confirm("後から追加した属性タグのみをすべて削除しますか？\n（初期の属性タグは消えません）")) {
        selectedTags["部位"] = selectedTags["部位"].filter(t => DEFAULT_TAGS["部位"].includes(t));
        selectedTags["状態"] = selectedTags["状態"].filter(t => DEFAULT_TAGS["状態"].includes(t));
        customTags = { "部位": [], "状態": [] };
        saveTagsToLocalStorage();
        renderTags();
        updatePreview();
      }
    }

    function adjustLayoutHeight() {
      const panel = document.getElementById('cameraPanel');
      const pw = panel.clientWidth - 8;
      const ph = panel.clientHeight - 8;
      if (pw / ph > 4 / 3) {
        previewFrame.style.height = ph + 'px';
        previewFrame.style.width = Math.round(ph * 4 / 3) + 'px';
      } else {
        previewFrame.style.width = pw + 'px';
        previewFrame.style.height = Math.round(pw * 3 / 4) + 'px';
      }
    }
    window.addEventListener('resize', adjustLayoutHeight);
    window.addEventListener('orientationchange', () => {
      setTimeout(adjustLayoutHeight, 200);
    });

    function renderCategoryTags(category, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const allCategoryTags = [...DEFAULT_TAGS[category], ...customTags[category]];

      allCategoryTags.forEach(name => {
        const isSelected = selectedTags[category].includes(name);
        const isCustom = !DEFAULT_TAGS[category].includes(name);

        const wrapper = document.createElement('div');
        wrapper.className = 'tag-wrapper' + (isSelected ? ' active' : '') + (isCustom ? ' custom-tag' : '');

        const btnText = document.createElement('button');
        btnText.className = 'tag-btn-text';
        btnText.innerText = name;
        btnText.onclick = () => toggleTag(category, name);
        wrapper.appendChild(btnText);

        if (isCustom) {
          const btnDel = document.createElement('button');
          btnDel.className = 'tag-del-btn';
          btnDel.innerText = '✕';
          btnDel.title = 'この追加タグを削除';
          btnDel.onclick = (e) => {
            e.stopPropagation();
            deleteCustomTag(category, name);
          };
          wrapper.appendChild(btnDel);
        }

        container.appendChild(wrapper);
      });
    }

    function renderTags() {
      renderCategoryTags("部位", "buisContainer");
      renderCategoryTags("状態", "jotaisContainer");
    }

    function toggleTag(category, name) {
      if (selectedTags[category].includes(name)) {
        selectedTags[category] = selectedTags[category].filter(item => item !== name);
      } else {
        selectedTags[category].push(name);
      }
      saveTagsToLocalStorage();
      renderTags();
      updatePreview();
    }

    function deleteCustomTag(category, name) {
      if (DEFAULT_TAGS[category].includes(name)) return;
      customTags[category] = customTags[category].filter(item => item !== name);
      selectedTags[category] = selectedTags[category].filter(item => item !== name);
      saveTagsToLocalStorage();
      renderTags();
      updatePreview();
    }

    function addNewTag() {
      const category = document.getElementById('targetCategory').value;
      const input = document.getElementById('newTagName');
      const val = input.value.trim();

      if (!val) {
        alert("追加する属性名を入力してください。");
        return;
      }

      if (DEFAULT_TAGS[category].includes(val) || customTags[category].includes(val)) {
        alert("すでに存在するタグ名です。");
        return;
      }

      customTags[category].push(val);
      if (!selectedTags[category].includes(val)) {
        selectedTags[category].push(val);
      }
      input.value = '';
      saveTagsToLocalStorage();
      renderTags();
      updatePreview();
    }

    function getNowString() {
      const now = new Date();
      return now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate() + ' ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    function updatePreview() {
      const title = siteTitleInput.value || '';
      const allSelected = [...selectedTags["部位"], ...selectedTags["状態"]];
      const tagText = allSelected.join(' / ');

      const titleEl = document.getElementById('liveTitle');
      const tagsEl = document.getElementById('liveTags');
      const dateEl = document.getElementById('liveDate');

      titleEl.innerText = title;
      titleEl.style.fontSize = overlayFontSize + 'px';

      tagsEl.innerText = tagText;
      tagsEl.style.fontSize = Math.round(overlayFontSize * 0.85) + 'px';

      dateEl.innerText = getNowString();
      dateEl.style.fontSize = Math.round(overlayFontSize * 0.7) + 'px';
    }

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
    }

    function startCamera() {
      stopCamera();
      navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: "environment",
          width: { ideal: 1280 },
          height: { ideal: 960 }
        },
        audio: false
      }).then(stream => {
        currentStream = stream;
        video.srcObject = stream;
        video.play().catch(e => console.log('Video play error:', e));
      }).catch(err => {
        console.log("Camera start error:", err);
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        adjustLayoutHeight();
        if (!isPhotoTaken) {
          startCamera();
        } else {
          resetCamera();
        }
      } else {
        stopCamera();
      }
    });

    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        adjustLayoutHeight();
        resetCamera();
      }
    });

    function updateFontSize(val) {
      overlayFontSize = parseInt(val, 10);
      document.getElementById('fontSizeVal').innerText = val + 'px';
      localStorage.setItem(STORAGE_KEY_FONTSIZE, overlayFontSize);
      showSaveIndicator();
      updatePreview();
    }

    function takePhoto() {
      isPhotoTaken = true;
      const vWidth = video.videoWidth || 1280;
      const vHeight = video.videoHeight || 960;

      let cropWidth, cropHeight, cropX, cropY;
      const targetRatio = 4 / 3;
      const currentRatio = vWidth / vHeight;

      if (currentRatio > targetRatio) {
        cropHeight = vHeight;
        cropWidth = vHeight * targetRatio;
        cropX = (vWidth - cropWidth) / 2;
        cropY = 0;
      } else {
        cropWidth = vWidth;
        cropHeight = vWidth / targetRatio;
        cropX = 0;
        cropY = (vHeight - cropHeight) / 2;
      }

      const outWidth = Math.max(Math.round(cropWidth), 1280);
      const outHeight = Math.max(Math.round(cropHeight), 960);
      canvas.width = outWidth;
      canvas.height = outHeight;

      const frameWidth = previewFrame.clientWidth || 400;
      const scale = outWidth / frameWidth;

      ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, outWidth, outHeight);

      const siteTitle = siteTitleInput.value || '';
      const allSelected = [...selectedTags["部位"], ...selectedTags["状態"]];
      const tagText = allSelected.join(' / ');
      const dateStr = getNowString();

      const titleSize = Math.round(overlayFontSize * scale);
      const tagSize = Math.round(overlayFontSize * 0.85 * scale);
      const dateSize = Math.round(overlayFontSize * 0.7 * scale);

      const padX = Math.round(12 * scale);
      const padY = Math.round(8 * scale);
      const borderLeftW = Math.round(4 * scale);
      const gap = Math.round(4 * scale);

      ctx.font = `bold ${titleSize}px sans-serif`;
      const titleW = ctx.measureText(siteTitle).width;
      ctx.font = `bold ${tagSize}px sans-serif`;
      const tagW = ctx.measureText(tagText).width;
      ctx.font = `${dateSize}px sans-serif`;
      const dateW = ctx.measureText(dateStr).width;

      const boxWidth = Math.max(titleW, tagW, dateW) + (padX * 2) + borderLeftW;
      const boxHeight = (padY * 2) + titleSize + tagSize + dateSize + (gap * 2);

      const boxX = Math.round(outWidth * 0.03);
      const boxY = Math.round(outHeight * 0.97) - boxHeight;

      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

      ctx.fillStyle = "#FFD700";
      ctx.fillRect(boxX, boxY, borderLeftW, boxHeight);

      ctx.textBaseline = "top";
      const textX = boxX + borderLeftW + padX;
      let currentY = boxY + padY;

      ctx.fillStyle = "#FFD700";
      ctx.font = `bold ${titleSize}px sans-serif`;
      ctx.fillText(siteTitle, textX, currentY);
      currentY += titleSize + gap;

      ctx.fillStyle = "#FFFFFF";
      ctx.font = `bold ${tagSize}px sans-serif`;
      ctx.fillText(tagText, textX, currentY);
      currentY += tagSize + gap;

      ctx.fillStyle = "#DDDDDD";
      ctx.font = `${dateSize}px sans-serif`;
      ctx.fillText(dateStr, textX, currentY);

      video.style.display = 'none';
      liveOverlay.style.display = 'none';
      canvas.style.display = 'block';

      shutterBtn.style.display = 'none';
      saveBtn.style.display = 'block';
      resetBtn.style.display = 'block';
    }

    function resetCamera() {
      isPhotoTaken = false;
      canvas.style.display = 'none';
      video.style.display = 'block';
      liveOverlay.style.display = 'block';

      shutterBtn.style.display = 'block';
      saveBtn.style.display = 'none';
      resetBtn.style.display = 'none';

      if (!currentStream || !currentStream.active || currentStream.getVideoTracks().some(t => t.readyState === 'ended')) {
        startCamera();
      } else {
        video.play().catch(() => startCamera());
      }
    }

    function saveAsJpeg() {
      const link = document.createElement('a');
      const timeStamp = new Date().toISOString().replace(/[-:T.]/g, "").slice(0, 14);
      link.download = `photo_${timeStamp}.jpg`;
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    }

    window.onload = () => {
      adjustLayoutHeight();

      const savedTitle = localStorage.getItem(STORAGE_KEY_TITLE);
      if (savedTitle !== null) {
        siteTitleInput.value = savedTitle;
      }

      document.getElementById('fontSizeSlider').value = overlayFontSize;
      document.getElementById('fontSizeVal').innerText = overlayFontSize + 'px';

      renderTags();
      startCamera();
      updatePreview();
      setInterval(() => { document.getElementById('liveDate').innerText = getNowString(); }, 10000);
    };
  </script>
</body>
</html>
