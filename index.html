<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>現場撮影用Webアプリ - 高画質4:3対応</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    ::-webkit-scrollbar-thumb {
      background: #444444;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #666666;
    }

    /* シャッター時のフラッシュアニメーション */
    @keyframes shutter-flash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    .flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      z-index: 50;
      pointer-events: none;
      animation: shutter-flash 0.35s ease-out forwards;
    }

    /* レンジスライダーのカスタマイズ */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: #374151;
      border-radius: 4px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #f59e0b;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -5px;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- メインアプリコンテナ -->
  <div class="flex flex-col md:flex-row w-screen h-screen overflow-hidden bg-black">
    
    <!-- 左側：カメラ/撮影表示エリア (4:3エリア維持) -->
    <div class="relative flex-1 bg-black flex justify-center items-center overflow-hidden min-h-[50vh] md:min-h-full">
      
      <!-- 4:3アスペクト比を維持するラッパー -->
      <div class="relative w-full h-full flex items-center justify-center">
        <video id="webcam" autoplay playsinline muted class="max-w-full max-h-full object-contain aspect-[4/3]"></video>
        <canvas id="capturedCanvas" class="hidden max-w-full max-h-full object-contain aspect-[4/3]"></canvas>
      </div>

      <!-- シャッターフラッシュ演出層 -->
      <div id="flashOverlay" class="hidden"></div>

      <!-- 撮影前のリアルタイムオーバーレイ表示 (左下) -->
      <div id="liveOverlay" class="absolute bottom-4 left-4 max-w-[85%] bg-black/80 backdrop-blur-sm border-l-4 border-amber-400 p-3.5 rounded-lg shadow-2xl pointer-events-none z-10 transition-all duration-200">
        <div id="liveTitle" class="text-amber-400 font-bold leading-tight break-words" style="font-size: 28px;">第1工区 擁壁点検</div>
        <div id="liveTags" class="text-white font-semibold mt-1.5 leading-snug break-words" style="font-size: 22px;">主桁 / ひびわれ</div>
      </div>

      <!-- LIVEバッジ -->
      <div id="liveBadge" class="absolute top-4 left-4 bg-red-600/90 text-white px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase flex items-center gap-2 shadow-md z-10">
        <span class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></span>
        <span>4:3 HD LIVE</span>
      </div>
    </div>

    <!-- 右側：スリムな操作パネル -->
    <div class="w-full md:w-[380px] lg:w-[420px] bg-zinc-900 border-t-2 md:border-t-0 md:border-l-2 border-zinc-800 flex flex-col h-[50vh] md:h-full z-20 shadow-xl">
      
      <!-- コントロールスクロール領域 -->
      <div class="flex-1 overflow-y-auto p-4 space-y-5">
        
        <!-- 現場タイトル入力 -->
        <div>
          <label for="siteTitle" class="block text-xs font-bold text-amber-400 uppercase tracking-wider mb-1.5 border-b border-amber-400/40 pb-1">
            📌 現場名称・タイトル
          </label>
          <input type="text" id="siteTitle" class="w-full px-3 py-2 text-base font-bold rounded-lg border-2 border-zinc-700 bg-zinc-800 text-white focus:outline-none focus:border-amber-400 transition" value="第1工区 擁壁点検" placeholder="点検タイトルを入力" oninput="updatePreview()">
        </div>

        <!-- 部位カテゴリ -->
        <div>
          <div class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2 border-b border-amber-400/40 pb-1 flex justify-between items-center">
            <span>🏗️ 部位カテゴリ</span>
            <span class="text-[10px] text-zinc-400 font-normal">複数選択可</span>
          </div>
          <div id="buisContainer" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- 状態カテゴリ -->
        <div>
          <div class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2 border-b border-amber-400/40 pb-1 flex justify-between items-center">
            <span>⚠️ 状態カテゴリ</span>
            <span class="text-[10px] text-zinc-400 font-normal">複数選択可</span>
          </div>
          <div id="jotaisContainer" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- タグ追加ボックス -->
        <div class="bg-zinc-800/60 p-3 rounded-lg border border-zinc-700/60">
          <div class="text-xs font-bold text-zinc-300 mb-2">➕ 新規属性タグを追加</div>
          <div class="flex gap-2">
            <select id="targetCategory" class="px-2 py-1.5 bg-zinc-800 text-white border border-zinc-600 rounded-md font-bold text-xs focus:outline-none focus:border-amber-400">
              <option value="部位">部位</option>
              <option value="状態">状態</option>
            </select>
            <input type="text" id="newTagName" placeholder="例: 排水溝" class="flex-1 px-2.5 py-1.5 text-xs font-bold rounded-md border border-zinc-600 bg-zinc-800 text-white focus:outline-none focus:border-amber-400">
            <button onclick="addNewTag()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white text-xs font-bold rounded-md transition shadow">
              追加
            </button>
          </div>
        </div>

        <!-- 合成文字サイズスライダー -->
        <div class="bg-zinc-800/60 p-3 rounded-lg border border-zinc-700/60 space-y-1">
          <div class="flex justify-between items-center text-xs font-bold text-zinc-300">
            <span>🔤 合成文字サイズ</span>
            <span id="fontSizeVal" class="text-amber-400 text-sm font-extrabold">48px</span>
          </div>
          <input type="range" id="fontSizeSlider" class="w-full" min="20" max="120" value="48" oninput="updateFontSize(this.value)">
        </div>

      </div>

      <!-- 操作アクションボタン -->
      <div class="p-3 bg-zinc-950 border-t border-zinc-800 flex gap-2">
        <button id="shutterBtn" onclick="takePhoto()" class="flex-1 py-3 bg-rose-600 hover:bg-rose-500 active:scale-[0.98] text-white text-base font-extrabold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          撮影する
        </button>

        <button id="saveBtn" onclick="saveAsJpeg()" class="hidden flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white text-base font-extrabold rounded-xl shadow-lg transition items-center justify-center gap-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
          JPEG保存
        </button>

        <button id="resetBtn" onclick="resetCamera()" class="hidden flex-1 py-3 bg-zinc-700 hover:bg-zinc-600 active:scale-[0.98] text-white text-base font-extrabold rounded-xl shadow-lg transition items-center justify-center gap-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          再撮影
        </button>
      </div>

    </div>
  </div>

  <script>
    // --- オフラインキャッシュ用 サービスワーカー ---
    if ('serviceWorker' in navigator) {
      try {
        const swCode = `
          const CACHE_NAME = 'site-camera-v12';
          self.addEventListener('install', (e) => {
            e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(['./'])));
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', (e) => {
            e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
          });
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW register bypassed:', err));
      } catch (err) {
        console.log('SW registration error:', err);
      }
    }

    // 要素参照とステート管理
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('capturedCanvas');
    const ctx = canvas.getContext('2d');
    const shutterBtn = document.getElementById('shutterBtn');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const liveOverlay = document.getElementById('liveOverlay');
    const liveBadge = document.getElementById('liveBadge');

    let overlayFontSize = 48;
    let audioCtx = null;

    let tagData = {
      "部位": [
        "排水ます", "伸縮装置", "上流側", "終点側", "起点側", "添架物", 
        "舗装", "主桁", "排水管", "地覆", "A1橋台", "A2橋台", 
        "高欄", "床版", "横桁", "支承", "下流側"
      ],
      "状態": [
        "変形", "腐食", "ひびわれ", "滞水", "破断", "抜け落ち", 
        "土砂詰まり", "路面の凹凸", "舗装の異常", "防食機能の劣化", 
        "鉄筋露出", "漏水", "洗堀", "剥離", "うき", "欠損", 
        "遊離石灰", "遊間の異常", "補修済み"
      ]
    };

    let selectedTags = {
      "部位": ["主桁"],
      "状態": ["ひびわれ"]
    };

    // タグのレンダリング処理
    function renderTags() {
      ['部位', '状態'].forEach(cat => {
        const containerId = cat === '部位' ? 'buisContainer' : 'jotaisContainer';
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        tagData[cat].forEach(name => {
          const isSelected = selectedTags[cat].includes(name);
          
          const tagBtn = document.createElement('div');
          tagBtn.className = `inline-flex items-center rounded-lg text-xs font-bold border transition-all overflow-hidden ${
            isSelected 
              ? 'bg-blue-700 border-amber-400 text-white shadow-md ring-1 ring-amber-400/50' 
              : 'bg-zinc-800 border-zinc-700 text-zinc-300 hover:bg-zinc-700'
          }`;

          const textSpan = document.createElement('span');
          textSpan.className = 'px-2.5 py-1.5 cursor-pointer select-none';
          textSpan.innerText = name;
          textSpan.onclick = () => toggleTag(cat, name);

          const delBtn = document.createElement('button');
          delBtn.className = 'px-1.5 py-1.5 text-zinc-400 hover:text-red-400 hover:bg-zinc-900/50 border-l border-zinc-700/50 transition';
          delBtn.innerText = '✕';
          delBtn.title = '削除';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteTag(cat, name);
          };

          tagBtn.appendChild(textSpan);
          tagBtn.appendChild(delBtn);
          container.appendChild(tagBtn);
        });
      });
    }

    function toggleTag(category, name) {
      if (selectedTags[category].includes(name)) {
        selectedTags[category] = selectedTags[category].filter(item => item !== name);
      } else {
        selectedTags[category].push(name);
      }
      renderTags();
      updatePreview();
    }

    function deleteTag(category, name) {
      tagData[category] = tagData[category].filter(item => item !== name);
      selectedTags[category] = selectedTags[category].filter(item => item !== name);
      renderTags();
      updatePreview();
    }

    function addNewTag() {
      const category = document.getElementById('targetCategory').value;
      const input = document.getElementById('newTagName');
      const val = input.value.trim();

      if (!val) {
        showToast("追加する属性名を入力してください。");
        return;
      }

      if (!tagData[category].includes(val)) {
        tagData[category].push(val);
        selectedTags[category].push(val);
        input.value = '';
        renderTags();
        updatePreview();
      } else {
        showToast("すでに存在するタグ名です。");
      }
    }

    function updatePreview() {
      const title = document.getElementById('siteTitle').value || '現場未設定';
      const liveTitleEl = document.getElementById('liveTitle');
      liveTitleEl.innerText = title;
      liveTitleEl.style.fontSize = Math.min(overlayFontSize, 32) + 'px';

      const allSelected = [...selectedTags["部位"], ...selectedTags["状態"]];
      const tagText = allSelected.length > 0 ? allSelected.join(' / ') : '（タグ未選択）';

      const liveTagsEl = document.getElementById('liveTags');
      liveTagsEl.innerText = tagText;
      liveTagsEl.style.fontSize = Math.min(Math.round(overlayFontSize * 0.75), 24) + 'px';
    }

    function updateFontSize(val) {
      overlayFontSize = parseInt(val, 10);
      document.getElementById('fontSizeVal').innerText = val + 'px';
      updatePreview();
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed top-5 left-1/2 -translate-x-1/2 bg-zinc-800 text-white font-bold px-4 py-2 rounded-lg shadow-xl border border-zinc-600 z-50 text-sm transition-all duration-300';
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // 1. カメラ起動：4:3のアスペクト比と最高ネイティブ解像度（2K/4K）を直指定
    function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast("お使いのブラウザはカメラ機能に対応していません。");
        return;
      }

      const constraints = {
        video: { 
          facingMode: "environment",
          aspectRatio: { ideal: 4 / 3 }, // ★ 4:3比率を優先指定
          width: { ideal: 2048, max: 4096 }, // 高解像度（2048x1536以上）を要求
          height: { ideal: 1536, max: 3072 }
        },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints).then(stream => {
        video.srcObject = stream;
      }).catch(err => {
        console.warn("4:3高解像度取得失敗、代替カメラで試行:", err);
        // フォールバック（通常高画質）
        navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, 
          audio: false 
        })
        .then(stream => { video.srcObject = stream; })
        .catch(e => showToast("カメラアクセスに失敗しました。設定を確認してください。"));
      });
    }

    // Web Audio APIによる疑似シャッター音発音
    function playShutterSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {
        // ブラウザ制限での発音ブロック回避用
      }
    }

    // 2. 撮影処理：厳密な 4:3 切り抜き ＋ カメラの元高解像度ピクセルをそのまま維持
    function takePhoto() {
      playShutterSound();

      // フラッシュ演出
      const flash = document.getElementById('flashOverlay');
      flash.className = 'flash-overlay';
      setTimeout(() => { flash.className = 'hidden'; }, 350);

      const vWidth = video.videoWidth || 1920;
      const vHeight = video.videoHeight || 1440;

      // 正確な 4:3 アスペクト比切り抜き領域の計算
      let cropWidth, cropHeight, cropX, cropY;
      const targetRatio = 4 / 3;
      const currentRatio = vWidth / vHeight;

      if (currentRatio > targetRatio) {
        cropHeight = vHeight;
        cropWidth = vHeight * targetRatio;
        cropX = (vWidth - cropWidth) / 2;
        cropY = 0;
      } else {
        cropWidth = vWidth;
        cropHeight = vWidth / targetRatio;
        cropX = 0;
        cropY = (vHeight - cropHeight) / 2;
      }

      // ★【高画質化の肝】カメラの生解像度ピクセル（1:1）をそのままCanvasに設定（引き延ばし無効化）
      canvas.width = Math.round(cropWidth);
      canvas.height = Math.round(cropHeight);

      // 解像度に応じた文字・パディングの動的拡大スケール率（標準1280px比）
      const baseWidth = 1280;
      const scale = canvas.width / baseWidth; 
      const drawFontSize = overlayFontSize * scale;
      const subFontSize = drawFontSize * 0.75;
      const padding = 24 * scale;

      // 原寸データ描画
      ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);

      const siteTitle = document.getElementById('siteTitle').value || '現場未設定';
      const allSelected = [...selectedTags["部位"], ...selectedTags["状態"]];
      const tagText = allSelected.length > 0 ? allSelected.join(' / ') : '（タグ未選択）';

      // 描画テキストの最大幅計測
      ctx.font = `bold ${Math.round(drawFontSize)}px sans-serif`;
      const titleWidth = ctx.measureText(siteTitle).width;

      ctx.font = `bold ${Math.round(subFontSize)}px sans-serif`;
      const tagWidth = ctx.measureText(tagText).width;

      const maxTextWidth = Math.max(titleWidth, tagWidth);
      const boxWidth = Math.min(maxTextWidth + (padding * 2), canvas.width * 0.85);
      const boxHeight = (drawFontSize + subFontSize) + (padding * 2) + (8 * scale);

      const boxX = padding;
      const boxY = canvas.height - boxHeight - padding;

      // 半透明背景ボックス描画
      ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 12 * scale);
      } else {
        ctx.rect(boxX, boxY, boxWidth, boxHeight);
      }
      ctx.fill();

      // 左端ゴールドアクセントライン
      ctx.fillStyle = "#F59E0B";
      ctx.fillRect(boxX, boxY, 8 * scale, boxHeight);

      // タイトル描画（ゴールド）
      const textX = boxX + padding;
      let textY = boxY + padding + drawFontSize * 0.8;

      ctx.fillStyle = "#FFD700";
      ctx.font = `bold ${Math.round(drawFontSize)}px sans-serif`;
      ctx.fillText(siteTitle, textX, textY);

      // タグ描画（白）
      textY += subFontSize + (10 * scale);
      ctx.fillStyle = "#FFFFFF";
      ctx.font = `bold ${Math.round(subFontSize)}px sans-serif`;
      ctx.fillText(tagText, textX, textY);

      // 表示切り替え
      video.classList.add('hidden');
      liveOverlay.classList.add('hidden');
      liveBadge.classList.add('hidden');
      canvas.classList.remove('hidden');

      shutterBtn.classList.add('hidden');
      shutterBtn.classList.remove('flex-1');
      saveBtn.classList.remove('hidden');
      saveBtn.classList.add('flex-1');
      resetBtn.classList.remove('hidden');
      resetBtn.classList.add('flex-1');
    }

    function resetCamera() {
      canvas.classList.add('hidden');
      video.classList.remove('hidden');
      liveOverlay.classList.remove('hidden');
      liveBadge.classList.remove('hidden');

      shutterBtn.classList.remove('hidden');
      shutterBtn.classList.add('flex-1');
      saveBtn.classList.add('hidden');
      resetBtn.classList.add('hidden');
    }

    function saveAsJpeg() {
      try {
        const link = document.createElement('a');
        const now = new Date();
        const timeStamp = now.getFullYear() +
          String(now.getMonth() + 1).padStart(2, '0') +
          String(now.getDate()).padStart(2, '0') + "_" +
          String(now.getHours()).padStart(2, '0') +
          String(now.getMinutes()).padStart(2, '0') +
          String(now.getSeconds()).padStart(2, '0');

        link.download = `現場写真_${timeStamp}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
        showToast("高画質画像を保存しました。");
      } catch (e) {
        showToast("保存処理に失敗しました。");
      }
    }

    // アプリ初期化
    window.onload = () => {
      renderTags();
      startCamera();
      updatePreview();
    };
  </script>
</body>
</html>
